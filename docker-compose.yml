version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: s360_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-s360}
      POSTGRES_USER: ${DB_USERNAME:-user_postgre}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-5327}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - s360_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-user_postgre}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: s360_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - s360_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: s360_app
    restart: unless-stopped
    working_dir: /var/www/html
    user: root
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - s360_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-s360}
      - DB_USERNAME=${DB_USERNAME:-user_postgre}
      - DB_PASSWORD=${DB_PASSWORD:-5327}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: s360_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - s360_network
    depends_on:
      - app

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: s360_queue
    restart: unless-stopped
    working_dir: /var/www/html
    user: root
    volumes:
      - ./:/var/www/html
    networks:
      - s360_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-s360}
      - DB_USERNAME=${DB_USERNAME:-user_postgre}
      - DB_PASSWORD=${DB_PASSWORD:-5327}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
    command: >
      sh -c "
        until nc -z postgres 5432 && nc -z redis 6379; do sleep 2; done &&
        php artisan queue:work --tries=3 --timeout=90
      "

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  s360_network:
    driver: bridge

